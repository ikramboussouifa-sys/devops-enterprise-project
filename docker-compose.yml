services:

  postgres:
    image: postgres:17
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DevOps123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: devops-api
    depends_on:
      - postgres
      - vault
    environment:
      DATABASE_URL: postgresql://postgres:DevOps123!@postgres:5432/devopsdb
    ports:
      - "8000:8000"

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/file
    command: vault server -dev -dev-root-token-id=root

volumes:
  postgres_data:
  vault-data: